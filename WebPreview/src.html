<title>Mazraa Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D farm, HUD cards pinned to the corners like a dashboard in a tractor cab. Single dark look on purpose (game HUD over a lit scene). */
:root{
  --panel: rgba(16, 30, 22, .84);
  --panel-solid: #12201a;
  --line: rgba(240, 229, 204, .16);
  --ink: #f2e9d4;
  --muted: #b8b19c;
  --wheat: #e8a83a;
  --leaf: #86c66d;
  --nile: #4fb3c8;
  --warn: #e46a4b;
  --bg: #0d1712;
  --display: "Baloo Bhaijaan 2", "Readex Pro", system-ui, sans-serif;
  --body: "Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{position:fixed;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
#top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#top > *{pointer-events:auto}
#status{padding:10px 14px;min-width:0;flex:0 1 320px;display:grid;gap:4px}
.money{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--wheat);font-variant-numeric:tabular-nums}
.money small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.clock{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.store{font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.store b{color:var(--ink);font-weight:500}
#tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tb{font:600 12px var(--body);color:var(--ink);background:rgba(240,229,204,.08);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.tb:hover{background:rgba(240,229,204,.16)}
.tb:focus-visible,.btn:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.tb kbd{font:600 10px var(--body);color:var(--wheat);margin-inline-start:4px}
#mission{padding:10px 14px;flex:0 1 300px;min-width:0;display:grid;gap:5px}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--wheat);font-weight:600}
[dir=rtl] .eyebrow{letter-spacing:0}
.mt{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;text-wrap:balance}
.md{font-size:12.5px;color:var(--muted);line-height:1.45}
.bar{height:6px;border-radius:3px;background:rgba(240,229,204,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:3px;transition:width .3s}
.mfoot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#vpanel{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));padding:10px 14px;display:grid;gap:4px;min-width:190px;font-variant-numeric:tabular-nums}
#vpanel .vt{font-family:var(--display);font-weight:700;font-size:16px}
#vpanel .row{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;color:var(--muted)}
#vpanel .row b{color:var(--ink);font-weight:500}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:500;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{display:inline-block;min-width:22px;text-align:center;font:700 12px var(--body);background:var(--wheat);color:#1d1406;border-radius:5px;padding:1px 6px;margin-inline-end:8px}
#toasts{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;text-align:center;animation:tin .25s ease-out}
.toast.good{border-color:rgba(134,198,109,.6)}.toast.gold{border-color:rgba(232,168,58,.7);color:var(--wheat)}.toast.bad{border-color:rgba(228,106,75,.7)}
@keyframes tin{from{transform:translateY(-6px);opacity:.4}to{transform:none;opacity:1}}
#marker{position:absolute;pointer-events:none;transform:translate(-50%,-100%);font:700 12px var(--body);color:#1d1406;background:var(--wheat);border-radius:999px;padding:3px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#marker::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--wheat)}
/* touch */
#touch{display:none}
@media (pointer:coarse){#touch{display:block}#prompt{bottom:calc(170px + env(safe-area-inset-bottom,0px))}#vpanel{bottom:calc(170px + env(safe-area-inset-bottom,0px))}.kbonly{display:none}}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(16,30,22,.45);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(240,229,204,.35)}
#tbtns{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,auto);gap:10px;align-items:end}
.tbtn{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 18px var(--display);touch-action:none}
.tbtn.big{width:76px;height:76px;background:var(--wheat);color:#1d1406;font-size:24px;grid-row:span 2}
/* modal */
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,10,7,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 2px;text-wrap:balance;color:var(--ink)}
.sheet h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--wheat);margin:16px 0 6px;font-weight:600}
[dir=rtl] .sheet h3{letter-spacing:0}
.sheet p{color:var(--muted);line-height:1.55;margin:4px 0;max-width:62ch}
.xbtn{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(240,229,204,.03)}
.item .k{font:700 11px var(--body);color:var(--wheat);min-width:16px;text-align:center}
.item .n{min-width:0}
.item .n div:first-child{font-weight:500}
.item .n div+div{font-size:12px;color:var(--muted)}
.btn{font:600 13px var(--body);border-radius:8px;border:0;padding:7px 12px;background:var(--wheat);color:#1d1406;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
table.t th{font-size:11px;color:var(--muted);font-weight:500}
table.t td.num{text-align:end}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px}
.pill.ok{background:rgba(134,198,109,.18);color:var(--leaf)}.pill.low{background:rgba(228,106,75,.18);color:#f08a6e}.pill.gold{background:rgba(232,168,58,.18);color:var(--wheat)}
.mbar{height:6px;border-radius:3px;background:rgba(240,229,204,.12);position:relative;min-width:70px}
.mbar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;color:var(--muted)}
.keys kbd{font:600 12px var(--body);color:var(--ink);background:rgba(240,229,204,.1);border:1px solid var(--line);border-radius:5px;padding:1px 6px;justify-self:start}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#intro .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#intro .ar{font-family:var(--display);font-size:34px;font-weight:800;color:var(--wheat)}
#intro .en{font-family:var(--display);font-size:26px;font-weight:700}
.load{font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .money{font-size:22px}.mt{font-size:15px}.md{display:none}#status{padding:8px 10px;flex:1 1 0}#mission{padding:8px 10px;flex:1 1 0}#toasts{top:42%}.tb{padding:4px 7px}
  .store{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Farm scene"></canvas>
<div id="hud">
  <div id="top">

    <div class="money"><span id="money">500</span> <small id="cur">EGP</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
const DATA = __DATA__;
const ECO = DATA.economy, CP = DATA.crops, MISSIONS = DATA.missions.missions;
const GOODS = {}; ECO.goods.forEach(g => GOODS[g.id] = g);
const ANIM = {}; ECO.animals.forEach(a => ANIM[a.id] = a);
const FIELD = {}; ECO.fieldCrops.forEach(c => FIELD[c.id] = c);
const CROP = {}; CP.crops.forEach(c => CROP[c.id] = c);
// Same thresholds as ConfigurationData.cs (active*Range)
const TH = { water: 10, nutrients: 15, energy: 12, climate: 9, health: 10, yieldProjection: 5 };
const STATS = Object.keys(TH);
const DAY = 360, SEASON_DAYS = 5, SEASONS = ['autumn', 'winter', 'spring', 'summer'];
const GROW = 45, KG_PER_YIELD = 12, FUEL_PRICE = 3, TOW_PRICE = 150;
const UPG = { capacity: { price: 1500, en: 'Truck bed upgrade (+200 kg)', ar: 'توسيع صندوق النقل (+200 كجم)' }, growth: { price: 2000, en: 'Growth lamps (+50% greenhouse speed)', ar: 'إضاءة نمو (+50% سرعة الصوبة)' } };
const IMPL = ['plow', 'seeder', 'harvester'];

// ---------- language ----------
const AR = {
  'Market':'السوق','Help':'مساعدة','EGP':'ج.م','Day':'اليوم','Storage':'المخزن','empty':'فارغ','Mission':'المهمة','Reward':'المكافأة',
  'Free play':'لعب حر','All 25 missions done. Keep growing the farm.':'خلصت الـ25 مهمة. كمّل تكبير المزرعة.',
  'autumn':'خريف','winter':'شتاء','spring':'ربيع','summer':'صيف','Clear':'صافي','Rain':'مطر',
  'Start the well':'شغّل البئر','Well running':'البئر شغال','Control station':'محطة التحكم','Greenhouse':'الصوبة',
  'Harvest':'احصد','Growing':'ينمو','Needs':'يحتاج','Ready':'جاهز','Healthy':'سليم','Low':'ناقص','OK':'تمام',
  'Optimize':'حسّن','Start the well first':'شغّل البئر الأول','Module':'الوحدة','Value':'القيمة','Beds':'الأحواض',
  'Plow':'احرث','Plant':'ازرع','Water':'اسقِ','No seeds. Buy some at the Farm Shop.':'مفيش بذور. اشتري من محل المزرعة.',
  'Choose seeds':'اختار البذور','Field plot':'قطعة أرض','ripe':'ناضج','off-season':'خارج الموسم',
  'Farm Shop':'محل المزرعة','Seeds':'بذور','Animals':'حيوانات','Upgrades':'تطويرات','Supplies':'مستلزمات','Buy':'اشتري','Owned':'عندك',
  'Not enough money':'الفلوس مش كفاية','Pen is full for this animal':'الحظيرة مليانة للنوع ده','Bought':'اشتريت',
  'Get in':'اركب','Truck':'عربية النقل','Tractor':'الجرار','Exit':'انزل','Speed':'السرعة','Fuel':'البنزين','Cargo':'الحمولة','Implement':'المعدّة',
  'plow':'محراث','seeder':'بذارة','harvester':'حصادة','Load cargo':'حمّل البضاعة','Sell cargo':'بيع الحمولة','Refuel':'فوّل',
  'Loading bay':'منطقة التحميل','Market pad':'منصة السوق','Nothing in storage to load':'المخزن فاضي','Truck is full':'العربية مليانة',
  'Loaded':'اتحمّل','Sold for':'اتباع بـ','Cargo is empty':'الحمولة فاضية','Out of fuel':'البنزين خلص','Tow to the farm':'اسحب للمزرعة',
  'Contracts':'العقود','Today\'s prices':'أسعار النهارده','Good':'الصنف','Price':'السعر','In storage':'في المخزن','In truck':'في العربية',
  'until day':'لحد يوم','left':'باقي','Contract complete':'العقد اتنفّذ','Water trough':'حوض المياه','Refill water':'املأ المياه',
  'Feed trough':'المعلف','feed units':'وحدة علف','Buy feed at the Farm Shop':'اشتري علف من المحل','Barn door':'باب الحظيرة','Clean the pen':'نضّف الحظيرة',
  'Product crate':'صندوق المنتجات','Collect':'اجمع','Nothing to collect yet':'لسه مفيش حاجة','Collected':'اتجمع',
  'Mission complete':'المهمة خلصت','New season':'موسم جديد','A module broke in':'وحدة عطلت في','It is raining. Fields are watered.':'بتمطر. الحقول اتسقت.',
  'A new animal was born':'اتولد حيوان جديد','Language':'اللغة','New game':'لعبة جديدة','Resume':'كمّل','Start farming':'ابدأ الزراعة',
  'Controls':'التحكم','Move':'تحرك','Run':'اجري','Interact / get in or out':'تفاعل / اركب أو انزل','Pad action: load, sell, refuel':'إجراء المنصة: تحميل، بيع، تموين',
  'Switch tractor implement':'غيّر معدّة الجرار','Market prices and contracts':'أسعار السوق والعقود','Look around':'لف الكاميرا','Drag':'اسحب',
  'Brake':'فرامل','Tow (when out of fuel)':'سحب (لما البنزين يخلص)','Reset all progress?':'تمسح كل التقدم؟','Yes, start over':'أيوه، من الأول','Cancel':'إلغاء',
  'Loading models':'تحميل النماذج','This is a browser preview of the Unity game. Same crops, prices, animals and 25 missions, simplified graphics.':'دي نسخة متصفح مبسطة من لعبة يونتي. نفس المحاصيل والأسعار والحيوانات والـ25 مهمة، برسومات أبسط.',
  'Your grandfather left you a farm in the Delta: two greenhouses, six field plots, an empty animal pen and an old truck. Get the water running, bring the greenhouses back to health, plant the fields and sell at the market in town.':'جدك ساب لك مزرعة في الدلتا: صوبتين، ست قطع أرض، حظيرة فاضية وعربية نقل قديمة. شغّل المياه، رجّع الصوب سليمة، ازرع الأرض وبيع في سوق البلد.',
  'Market is south, down the dirt road.':'السوق جنوب، آخر الطريق الترابي.','Saved in this browser.':'اتحفظ في المتصفح ده.',
  'Greenhouse needs':'الصوبة محتاجة','Sell at the market with the truck':'بيع في السوق بالعربية','Animals in pen':'الحيوانات في الحظيرة',
  'Pen':'الحظيرة','Cleanliness':'النظافة','Feed':'العلف','No animals yet':'لسه مفيش حيوانات','m':'م','Season':'الموسم','to':'إلى',
  'Free':'ببلاش','Max':'الحد الأقصى','bought':'اتشترى','Wet':'مبلول','Dry':'ناشف','kg':'كجم','Plowed':'محروث','Grass':'نجيلة',
  'Drive over plots with the hitch. Q switches the implement.':'اعدّي على قطع الأرض بالمعدّة. Q تغيّر المعدّة.',
  'Park on the green bay and press R to load.':'اركن على المنصة الخضرا ودوس R للتحميل.','Park on the gold market pad and press R to sell.':'اركن على منصة السوق الدهبي ودوس R للبيع.',
  'Towed to the loading bay':'اتسحبت لمنطقة التحميل','Well started. Irrigation can now be optimized.':'البئر اشتغل. تقدر تحسّن الري دلوقتي.'
};
let lang = 'en';
const T = s => (lang === 'ar' && AR[s]) || s;
const N = (o, k = 'name') => lang === 'ar' ? (o[k + 'Ar'] || o[k + 'En']) : o[k + 'En'];
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const unit = id => lang === 'ar' ? GOODS[id].unitAr : GOODS[id].unitEn;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- state ----------
function randMods() { const m = {}; STATS.forEach(s => m[s] = Math.round(rnd(0, TH[s] * 0.5))); return m; }
function newState() {
  const gh = [{ mods: randMods(), beds: [] }, { mods: randMods(), beds: [] }];
  CP.beds.forEach(b => {
    const i = b.key.indexOf('GreenHouse-1') === 0 ? 1 : 0;
    gh[i].beds.push({ crop: b.crop, own: { water: b.water, nutrients: b.nutrients, energy: b.energy, climate: b.climate, health: b.health, yieldProjection: b.yieldProjection }, g: 0 });
  });
  return {
    v: 1, money: 500, day: 1, time: DAY * 0.3, goods: {}, seeds: { wheat: 2 }, feed: 0, animals: [], up: { capacity: 0, growth: 0 }, well: false, gh,
    plots: Array.from({ length: 6 }, () => ({ s: 'empty', crop: null, g: 0, w: 0 })),
    pen: { water: 0.6, clean: 0.8, crate: {}, breed: {}, timers: {} },
    veh: { truck: { x: -2, z: -25, r: Math.PI, fuel: 60, cargo: {} }, tractor: { x: 7, z: -8, r: Math.PI / 2, fuel: 40, impl: 0 } },
    player: { x: 0, z: 2 }, mi: 0, mp: 0, contracts: [], prices: {}, priceDay: 0, sold: {}, rain: 0, lang: 'en', earned: 0
  };
}
const SAVE_KEY = 'mazraa.preview.v1';
let S;
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(newState(), o); } } catch (e) { S = null; }
if (!S) S = newState();
lang = S.lang || 'en';
function save() { try { S.lang = lang; localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

const seasonIdx = () => Math.floor((S.day - 1) / SEASON_DAYS) % 4;

function rollPrices() {
  S.prices = {};
  ECO.goods.forEach(g => {
    let f = rnd(0.85, 1.2); const fc = FIELD[g.id];
    if (fc) f *= fc.seasons.indexOf(season()) >= 0 ? 0.88 : 1.18;
    S.prices[g.id] = +(g.price * f).toFixed(2);
  });
  S.sold = {}; S.priceDay = S.day;
  S.contracts = S.contracts.filter(c => c.until >= S.day && c.left > 0);
  while (S.contracts.length < 2) {
    const g = pick(['crops', 'wheat', 'potato', 'onion', 'watermelon', 'milk', 'eggs', 'wool']);
    const kg = g === 'eggs' ? 200 : g === 'wool' ? 20 : g === 'milk' ? 60 : Math.round(rnd(5, 12)) * 10;
    S.contracts.push({ g, kg, left: kg, mult: +rnd(1.3, 1.7).toFixed(2), until: S.day + 3 });
  }
}

    const s = 0.45 + 0.75 * (ok ? Math.max(b.g, 0.15) : 0.15);
    v.plants.forEach(p => p.scale.set(s, s, s));
    v.fruits.forEach(f => { f.visible = b.g > 0.45; const fs = clamp((b.g - 0.45) * 2, 0.2, 1); f.scale.set(fs, fs, fs); f.position.y = 0.5 + 0.55 * s; });
  });
  GH.forEach((g, i) => g.screen.material.color.set(ghHealthy(S.gh[i]) ? 0x6fe36f : 0xff7755));
  syncPlots();
  window.__trough.scale.y = 1; window.__trough.position.y = 0.12 + 0.33 * S.pen.water; window.__trough.visible = S.pen.water > 0.02;
  window.__hay.visible = S.feed > 0;
  window.__penGround.material.color.setRGB(0.61 - 0.15 * (1 - S.pen.clean), 0.54 - 0.17 * (1 - S.pen.clean), 0.36 - 0.12 * (1 - S.pen.clean));
  const ck = cargoKg(), boxes = Math.ceil(ck / capacity() * 8); cargoG.children.forEach((b, i) => b.visible = i < boxes);
}

// ---------- panels ----------
let modalKey = null, modalKind = '';
function openModal(html, kind, onKeyFn) {
  $('mbody').innerHTML = html; $('modal').hidden = false; modalOpen = true; modalKind = kind || ''; modalKey = onKeyFn || null;
  for (const k in keys) keys[k] = false; joy.x = joy.y = 0;
  applyDir();
}
function closeModal() { if (!modalOpen) return; $('modal').hidden = true; modalOpen = false; modalKind = ''; modalKey = null; canvas.focus(); refreshHud(); save(); }
$('mx').onclick = closeModal;
$('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
let curStation = 0;
function openStation(gi) {
  curStation = gi;
  const g = S.gh[gi];
  let h = '<h2>' + T('Control station') + ' · ' + T('Greenhouse') + ' ' + (gi + 1) + '</h2>';
  h += '<p>' + T('Greenhouse needs') + ': ' + (STATS.filter(s => g.beds.some(b => b.own[s] < TH[s] && g.mods[s] < TH[s])).map(modName).join(', ') || T('OK')) + '</p>';
  h += '<h3>' + T('Module') + '</h3><div class="list">';
  STATS.forEach((s, i) => {
    const v = g.mods[s], ok = v >= TH[s], blocked = s === 'water' && !S.well;
    const pct = clamp(v / TH[s], 0, 1) * 100;
    h += '<div class="item"><span class="k">' + (i + 1) + '</span><div class="n"><div>' + modName(s) + ' <span class="pill ' + (ok ? 'ok' : 'low') + '">' + (ok ? T('OK') : T('Low')) + '</span></div><div style="display:flex;align-items:center;gap:8px"><span class="mbar" style="flex:1"><i style="width:' + pct + '%;background:' + (ok ? 'var(--leaf)' : 'var(--warn)') + '"></i></span><span>' + v + ' / ' + TH[s] + '</span></div></div>' +
      (ok ? '<span class="pill ok">✓</span>' : '<button class="btn" data-opt="' + s + '"' + (blocked ? ' disabled title="' + T('Start the well first') + '"' : '') + '>' + (blocked ? T('Start the well first') : T('Optimize')) + '</button>') + '</div>';
  });
  h += '</div><h3>' + T('Beds') + '</h3><table class="t"><tbody>';
  g.beds.forEach(b => {
    const ok = bedHealthy(b, g), need = bedNeeds(b, g);
    h += '<tr><td>' + esc(N(CROP[b.crop] || { nameEn: b.crop, nameAr: b.crop })) + '</td><td>' + (b.g >= 1 ? '<span class="pill gold">' + T('Ready') + '</span>' : ok ? '<span class="pill ok">' + T('Healthy') + '</span>' : '<span class="pill low">' + need.map(modName).join(', ') + '</span>') + '</td><td class="num">' + Math.floor(b.g * 100) + '%</td></tr>';
  });
  h += '</tbody></table>';
  const doOpt = s => {
    if (g.mods[s] >= TH[s] || (s === 'water' && !S.well)) return;
    g.mods[s] = TH[s]; emit('optimize'); refreshHud(); openStation(gi);
  };
  openModal(h, 'station', d => { const s = STATS[d - 1]; if (s) doOpt(s); });
  $('mbody').querySelectorAll('[data-opt]').forEach(b => b.onclick = () => doOpt(b.dataset.opt));
}
function shopItems() {
  const it = [];
  ECO.fieldCrops.forEach(c => it.push({ g: 'Seeds', name: N(c), sub: c.yieldKg + ' ' + T('kg') + ' · ' + c.seasons.map(T).join(', ') + (S.seeds[c.id] ? ' · ' + T('Owned') + ' ' + S.seeds[c.id] : ''), price: c.seedPrice, buy() { S.seeds[c.id] = (S.seeds[c.id] || 0) + 1; } }));
  it.push({ g: 'Supplies', name: N(ECO.feed), sub: T('Owned') + ' ' + S.feed.toFixed(1), price: ECO.feed.price, buy() { S.feed += ECO.feed.units; emit('buyFeed'); } });
  ECO.animals.forEach(a => { const n = S.animals.filter(x => x.t === a.id).length; it.push({ g: 'Animals', name: N(a), sub: a.amount + ' ' + N(GOODS[a.product]) + ' / ' + a.interval + 's · ' + T('Owned') + ' ' + n + '/' + a.max, price: a.price, full: n >= a.max, buy() { addAnimal(a.id); emit('buyAnimal'); } }); });
  ['capacity', 'growth'].forEach(u => it.push({ g: 'Upgrades', name: lang === 'ar' ? UPG[u].ar : UPG[u].en, sub: S.up[u] ? T('bought') : '', price: UPG[u].price, full: !!S.up[u], buy() { S.up[u] = 1; emit('buyUpgrade'); } }));
  return it;
}
function openShop() {
  const items = shopItems(); let h = '<h2>' + T('Farm Shop') + '</h2>'; let grp = '';
  items.forEach((x, i) => {
    if (x.g !== grp) { if (grp) h += '</div>'; grp = x.g; h += '<h3>' + T(grp) + '</h3><div class="list">'; }
    const key = i < 9 ? String(i + 1) : '';
    h += '<div class="item"><span class="k">' + key + '</span><div class="n"><div>' + esc(x.name) + '</div><div>' + esc(x.sub) + '</div></div><button class="btn" data-i="' + i + '"' + (x.full || S.money < x.price ? ' disabled' : '') + '>' + (x.full ? T('Max') : fmt(x.price) + ' ' + T('EGP')) + '</button></div>';
  });
  h += '</div>';
  const buy = i => { const x = items[i]; if (!x) return; if (x.full) { toast(T('Pen is full for this animal'), 'bad'); return; } if (S.money < x.price) { toast(T('Not enough money'), 'bad'); return; } S.money -= x.price; x.buy(); toast(T('Bought') + ': ' + x.name, 'good'); refreshHud(); save(); openShop(); };
  openModal(h, 'shop', d => buy(d - 1));
  $('mbody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => buy(+b.dataset.i));
}
function openSeeds(i, owned) {
  let h = '<h2>' + T('Choose seeds') + '</h2><div class="list">';
  owned.forEach((id, n) => { const fc = FIELD[id], inS = fc.seasons.indexOf(season()) >= 0; h += '<div class="item"><span class="k">' + (n + 1) + '</span><div class="n"><div>' + esc(N(fc)) + ' ×' + S.seeds[id] + '</div><div>' + (inS ? T(season()) + ' ✓' : T('off-season')) + '</div></div><button class="btn" data-s="' + id + '">' + T('Plant') + '</button></div>'; });
  h += '</div>';
  const go = id => { if (!id) return; plant(i, id); closeModal(); };
  openModal(h, 'seeds', d => go(owned[d - 1]));
  $('mbody').querySelectorAll('[data-s]').forEach(b => b.onclick = () => go(b.dataset.s));
}
function openMarket() {
  let h = '<h2>' + T('Market') + '</h2><p>' + T('Market is south, down the dirt road.') + ' ' + T('Sell at the market with the truck') + '.</p>';
  h += '<h3>' + T('Contracts') + '</h3><div class="list">';
  S.contracts.forEach(c => { h += '<div class="item"><span class="k">×' + c.mult + '</span><div class="n"><div>' + fmt(c.kg) + ' ' + unit(c.g) + ' ' + esc(N(GOODS[c.g])) + '</div><div>' + T('left') + ' ' + fmt(c.left) + ' · ' + T('until day') + ' ' + c.until + '</div></div><span class="pill gold">' + fmt(price(c.g) * c.mult) + '/' + unit(c.g) + '</span></div>'; });
  h += '</div><h3>' + T('Today\'s prices') + '</h3><div style="overflow-x:auto"><table class="t"><thead><tr><th>' + T('Good') + '</th><th class="num" style="text-align:end">' + T('Price') + '</th><th class="num" style="text-align:end">' + T('In storage') + '</th><th class="num" style="text-align:end">' + T('In truck') + '</th></tr></thead><tbody>';
  ECO.goods.forEach(g => { const base = g.price, p = price(g.id), up = p >= base; h += '<tr><td>' + esc(N(g)) + '</td><td class="num" style="color:' + (up ? 'var(--leaf)' : '#f08a6e') + '">' + p.toFixed(1) + ' ' + T('EGP') + '/' + unit(g.id) + '</td><td class="num">' + fmt(S.goods[g.id] || 0) + '</td><td class="num">' + fmt(S.veh.truck.cargo[g.id] || 0) + '</td></tr>'; });
  h += '</tbody></table></div>';
  openModal(h, 'market');
}
function openHelp(first) {
  let h = '<div id="intro"><div class="brand"><span class="ar">المزرعة</span><span class="en">Mazraa</span></div>';
  h += '<p>' + T('Your grandfather left you a farm in the Delta: two greenhouses, six field plots, an empty animal pen and an old truck. Get the water running, bring the greenhouses back to health, plant the fields and sell at the market in town.') + '</p>';
  h += '<p>' + T('This is a browser preview of the Unity game. Same crops, prices, animals and 25 missions, simplified graphics.') + '</p>';
  h += '<h3>' + T('Controls') + '</h3><div class="keys">';
  const rows = coarse ? [['◎', 'Move'], [T('Drag'), 'Look around'], ['E', 'Interact / get in or out'], ['R', 'Pad action: load, sell, refuel'], ['Q', 'Switch tractor implement']]
    : [['WASD', 'Move'], ['Shift', 'Run'], [T('Drag'), 'Look around'], ['E', 'Interact / get in or out'], ['R', 'Pad action: load, sell, refuel'], ['Q', 'Switch tractor implement'], ['Space', 'Brake'], ['T', 'Tow (when out of fuel)'], ['M', 'Market prices and contracts'], ['L', 'Language']];
  rows.forEach(r => h += '<kbd>' + r[0] + '</kbd><span>' + T(r[1]) + '</span>');
  h += '</div><div class="row2"><button class="btn" id="go">' + (first ? T('Start farming') : T('Resume')) + '</button><button class="btn ghost" id="lng">' + (lang === 'ar' ? 'English' : 'عربي') + '</button><button class="btn ghost" id="reset">' + T('New game') + '</button></div>';
  h += '<p class="load" id="loadtxt"></p><p class="load">' + T('Saved in this browser.') + ' 3D models: Kenney, Quaternius (CC0).</p></div>';
  openModal(h, 'help');
  $('go').onclick = closeModal; $('lng').onclick = () => { toggleLang(); openHelp(first); };
  $('reset').onclick = () => {
    $('mbody').querySelector('.row2').innerHTML = '<span style="align-self:center">' + T('Reset all progress?') + '</span><button class="btn" id="yes">' + T('Yes, start over') + '</button><button class="btn ghost" id="no">' + T('Cancel') + '</button>';
    $('yes').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; location.reload(); };
    $('no').onclick = () => openHelp(first);
  };
  updLoad();
}
function updLoad() { const el = document.getElementById('loadtxt'); if (el) el.textContent = loading ? T('Loading models') + ' ' + loaded + '/' + loading : ''; }
function applyDir() {
  const d = lang === 'ar' ? 'rtl' : 'ltr';
  ['top', 'vpanel', 'mbody', 'prompt', 'toasts'].forEach(id => $(id).dir = d);
  document.documentElement.lang = lang;
  $('bLang').firstChild.textContent = lang === 'ar' ? 'English' : 'عربي';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T(e.dataset.t));
}
function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar'; applyDir(); refreshHud(); save();
  if (modalOpen) { if (modalKind === 'market') openMarket(); else if (modalKind === 'shop') openShop(); else if (modalKind === 'station') openStation(curStation); }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clockT += dt;
  if (!modalOpen || modalKind !== 'help') simulate(dt);
  if (P.inV) updateVehicle(dt); else updatePlayer(dt);
  updateAnimals(dt);
  mixers.forEach(m => m.update(dt));
  // camera
  const tgt = P.inV ? VSPEC[P.inV].g.position : player.position;
  if (P.inV && clockT - lastDrag > 1.5) { const want = S.veh[P.inV].r + Math.PI; let d = want - CAM.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); CAM.yaw += d * Math.min(1, dt * 2.5); }
  const cd = CAM.dist;
  camera.position.set(tgt.x + Math.sin(CAM.yaw) * Math.cos(CAM.pitch) * cd, 1.6 + Math.sin(CAM.pitch) * cd, tgt.z + Math.cos(CAM.yaw) * Math.cos(CAM.pitch) * cd);
  camera.lookAt(tgt.x, 1.4, tgt.z);
  // effects
  if (S.well) WELL.wheel.rotation.x += dt * 2;
  window.__water.material.color.setHSL(0.53, 0.45, 0.4 + Math.sin(clockT) * 0.02);
  rain.visible = S.rain > 0;
  if (rain.visible) { const a = rainGeo.attributes.position.array; for (let i = 0; i < RAIN_N; i++) { a[i * 3 + 1] -= dt * 18; if (a[i * 3 + 1] < 0) a[i * 3 + 1] += 22; } rainGeo.attributes.position.needsUpdate = true; rain.position.set(tgt.x, 0, tgt.z); }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt; f.vy -= 9 * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt; f.m.material.opacity = 1 - f.t / 0.9; if (f.t > 0.9) { scene.remove(f.m); fx.splice(i, 1); } }
  updateSky();
  updatePrompt(); updateMarker();
  hudT += dt; if (hudT > 0.25) { hudT = 0; checkMission(); syncVisuals(); refreshHud(); }
  saveT += dt; if (saveT > 6) { saveT = 0; save(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.MZ = { get S() { return S; }, emit, P, tractorWork, updateVehicle, sellCargo, loadCargo, plant, harvestPlot, interact, padAction, enter, exitVehicle, plotAct, openShop, player, VSPEC, VEL, simulate, checkMission };
applyDir(); syncVisuals(); refreshHud();
openHelp(true);
requestAnimationFrame(frame);
})();
</script>
